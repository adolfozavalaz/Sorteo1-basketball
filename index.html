:root{--bg:#fff7ed;--fg:#1f2937;--card:#fff;--ac:#ea580c;--ok:#16a34a;--tk:#e5e7eb;--tkfg:#6b7280;--bd:#fdba74;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:1.4rem;line-height:1.25;text-align:center;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.95rem}
.card b{color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px;font-size:.9rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}

.n{border:2px solid var(--ok);border-radius:8px;padding:6px 0;text-align:center;font-weight:700;background:var(--card);color:var(--fg);font-size:.95rem;min-height:44px;box-sizing:border-box}
.n small{display:block;font-size:.65rem;font-weight:600}
.n.t{background:var(--tk);border-color:var(--tk);color:var(--tkfg)}
.own .n{cursor:pointer}
button{font:inherit;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--ac)}
.bar{background:var(--card);border:2px dashed var(--ac);border-radius:12px;padding:10px;margin-bottom:12px;text-align:center;font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.md input{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
.md label{font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.bar button+button{margin-left:6px}</style></head><body>

const app=document.getElementById('app');
const admin=location.hash==='#admin';
const KEY='sorteo_registro_privado';
const getR=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
const setR=r=>{try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}};
const T=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
function render(){
  const taken=Object.keys(S.taken).length;
  app.innerHTML='<h1>Sorteo pro fondos Equipo de Basketball de papás de Los Álamos</h1>'+
  '<div class="card"><div>💰 Precio por número: <b id="c1"></b></div><div>🏆 Premios:<br><b id="c3" style="white-space:pre-line"></b></div><div>📅 Fecha del sorteo: <b id="c4"></b></div></div>'+
  '<div class="card" style="text-align:center"><div>📲 <b>Yapea tu número aquí</b></div><img src="'+QR+'" alt="QR de Yape" style="width:240px;max-width:80%;border-radius:12px;margin:8px 0"><div id="c2" style="font-weight:700"></div><div style="font-size:.85rem">Después de yapear, envía tu comprobante y el número elegido al organizador.</div></div>'+
  (admin?'<div class="bar">Modo organizador: toca un número para registrarlo o editarlo. Luego descarga el archivo y súbelo a GitHub.<br><div style="margin-top:8px"><button id="dl">Descargar index.html</button><button class="g" id="ec">Editar datos</button><button class="g" id="csv">Registro privado (CSV)</button></div></div>':'')+
  '<div class="row"><span><i class="dot" style="border:2px solid var(--ok)"></i>Disponible: <b>'+(500-taken)+'</b></span><span><i class="dot" style="background:var(--tk)"></i>Tomado: <b>'+taken+'</b></span></div>'+
  '<div id="grid" class="'+(admin?'own':'')+'"></div>';
  T('c1',S.cfg.precio);T('c2',S.cfg.yape);T('c3',S.cfg.premios.split(' | ').join('\n'));T('c4',S.cfg.fecha);
  const g=document.getElementById('grid');
  for(let i=1;i<=500;i++){
    const d=document.createElement('div');const ini=S.taken[i];
    d.className='n'+(ini?' t':'');d.textContent=i;
    if(ini){const s=document.createElement('small');s.textContent=ini;d.appendChild(s)}
    if(admin)d.onclick=()=>edit(i);
    g.appendChild(d);
  }
  if(admin){
    document.getElementById('dl').onclick=()=>save('index.html',buildDoc(),'text/html');
    document.getElementById('ec').onclick=editCfg;
    document.getElementById('csv').onclick=csv;
  }
}
function save(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function buildDoc(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function csv(){
  const r=getR(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  let t='numero,nombre,apellido,operacion_yape\n';
  Object.keys(r).sort((a,b)=>a-b).forEach(n=>t+=[n,q(r[n].nombre),q(r[n].apellido),q(r[n].op)].join(',')+'\n');
  save('registro-sorteo.csv',t,'text/csv');
}
function modal(html){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="md">'+html+'</div>';
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  document.body.appendChild(o);return o;
}
function edit(n){
  const R=getR(),r=R[n];
  const o=modal('<h3 style="margin:0 0 8px">Número '+n+'</h3><label>Nombre</label><input id="f1"><label>Apellido</label><input id="f2"><label>N.º de operación Yape</label><input id="f3" inputmode="numeric"><div class="acts"><button id="sv">Guardar</button>'+(S.taken[n]?'<button class="g" id="lb">Liberar</button>':'')+'<button class="g" id="cx">Cancelar</button></div>');
  if(r){o.querySelector('#f1').value=r.nombre||'';o.querySelector('#f2').value=r.apellido||'';o.querySelector('#f3').value=r.op||''}
  o.querySelector('#cx').onclick=()=>o.remove();
  o.querySelector('#sv').onclick=()=>{
    const a=o.querySelector('#f1').value.trim(),b=o.querySelector('#f2').value.trim(),c=o.querySelector('#f3').value.trim();
    if(!a||!b||!c){alert('Completa nombre, apellido y número de operación.');return}
    R[n]={nombre:a,apellido:b,op:c};setR(R);
    S.taken[n]=(a[0]+b[0]).toUpperCase();o.remove();render();
  };
  const lb=o.querySelector('#lb');
  if(lb)lb.onclick=()=>{
    if(!confirm('¿Liberar el número '+n+'?'))return;
    delete R[n];setR(R);delete S.taken[n];o.remove();render();
  };
}
function editCfg(){
  const k=[['precio','Precio por número'],['yape','Titular de Yape'],['premios','Premios (separa con  | )'],['fecha','Fecha del sorteo']];
  const o=modal('<h3 style="margin:0 0 8px">Datos del sorteo</h3>'+k.map(x=>'<label>'+x[1]+'</label><input id="k_'+x[0]+'">').join('')+'<div class="acts"><button id="sv">Guardar</button><button class="g" id="cx">Cancelar</button></div>');
  k.forEach(x=>o.querySelector('#k_'+x[0]).value=S.cfg[x[0]]);
  o.querySelector('#cx').onclick=()=>o.remove();
  o.querySelector('#sv').onclick=()=>{k.forEach(x=>S.cfg[x[0]]=o.querySelector('#k_'+x[0]).value.trim());o.remove();render()};
}
render();
</script></body></html>
